[package]
name = "catwright"
version = "0.4.0"
edition = "2021"
description = "Catwright: native Rust desktop GUI harness for the Mistral Vibe agent (via ACP); privacy-first. Unofficial, not affiliated with Mistral AI."
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "5"
# Sandboxed JavaScript for ```ui-js tool blocks: pure-Rust engine, no I/O
# (no console/fetch/fs), default features off (no Temporal/timezone data).
boa_engine = { version = "0.22.0", default-features = false }

[profile.release]
opt-level = 2
